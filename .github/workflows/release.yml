name: Package release zip

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: |
          mkdir -p dist
          zip -r dist/library.zip . \
            -x ".git/*" -x ".github/*" -x "dist/*" -x "tmp/*"

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/library.zip \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
